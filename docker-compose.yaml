services:
  postgres:
    image: postgres:17
    container_name: carPooling
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepak
      POSTGRES_PASSWORD: deepak
      POSTGRES_DB: appdb
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgres/data

volumes:
  postgres_data: